# }

mpris {
  format      = "{state}"
  format_none = ""
  state_pause = "PA"
  state_play  = "PL"
  state_stop  = "ST"
  separator = false
  player_priority = "[mpd, mpv, *]"
}

xkb_input {
  switcher              = "swaymsg"
  format_input          = "\?color=s {s}"
  inputs                = [{"name": "*keyboard*", "type": "keyboard"}]
  separator             = true
  separator_block_width = 3
}
