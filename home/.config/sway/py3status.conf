######################################################

general {
  interval        = 5
  colors          = true
  color_good      = "#86AD85"
  color_degraded  = "#FE8600"
  color_bad       = "#FF5500"
}

######################################################

order += "window"
order += "sysdata"
order += "external_script disk"
order += "wifi"
order += "bluetooth"
order += "external_script bluez_profile"
order += "volume_status mic"
order += "backlight"
order += "external_script wlsunset"
order += "volume_status"
order += "battery_level"
order += "external_script power"
order += "external_script tuned"
order += "clock"
order += "sway_idle"
# order += "do_not_disturb"
order += "mpris"
order += "xkb_input"

######################################################

window {
  format = "{title}"
}

sysdata {
  format  =   "[\?color=cpu_used_percent CPU: {cpu_used_percent:d}%]  "
  format  +=  "[\?color=mem_used_percent RAM: {mem_used_percent:d}%]  "
  format  +=  "[\?color=cpu_temp TH: {cpu_temp:d}°C]"

  cache_timeout = 5
  separator     = false
  thresholds    = {
    "cpu_used_percent": [(0, ""), (20, "degraded"), (60, "bad")],
    "mem_used_percent": [(0, ""), (50, "degraded"), (90, "bad")],
    "cpu_temp":         [(0, ""), (50, "degraded"), (75, "bad")]
  }
}

external_script "disk" {
  format        = "FS: {output}"
  cache_timeout = 60
  script_path   = "df -h / | tail -n 1 | awk  '{print $5}'"
}

systemd_suspend_inhibitor {
  format      = "[\?color=state S: [\?if=state OFF|ON]]"
  lock_types  = ["handle-lid-switch", "idle"]
  thresholds  = [(True, "degraded"), (False, "good")]
}

wifi {
  format            = "WLAN: {ssid} {signal_percent}%|WLAN: down"
  bitrate_bad       = 0
  bitrate_degraded  = 0
  signal_degraded   = 70
  signal_bad        = 30
  cache_timeout     = 5
  on_click 2        = "exec foot -a foot-float -e impala"
}

bluetooth {
  format_adapter          = "\?if=powered BT: {format_device}|\?color=degraded BT: off"
  format_device           = "\?if=connected {alias} {battery}%"
  format_device_separator = " ^ "
  on_click 3              = "exec ~/bin/bluez-toggle.sh --connect-known-headset"
  on_click 2              = "exec foot -a foot-float -e bluetui"
}

external_script "bluez_profile" {
  format        = "{output}"
  cache_timeout = 5
  script_path   = "~/bin/bluez-card-profile.py"
  on_click 3    = "exec ~/bin/bluez-card-profile.py --switch    --py3status"
  on_click 2    = "exec ~/bin/bluez-card-profile.py --reconnect --py3status"
}

backlight {
  brightness_delta  = 1
  format            = "LED: {level}%"
  button_up         = 0
  button_down       = 0
  on_click 2        = "exec brightnessctl -d '*::kbd_backlight' set 50%-"
  on_click 3        = "exec brightnessctl -d '*::kbd_backlight' set +50%"
  on_click 4        = "exec brightnessctl set +1%"
  on_click 5        = "exec brightnessctl set 1%-"
  separator         = false

  separator_block_width = 4
}

external_script "wlsunset" {
  format        = "{output}"
  cache_timeout = 5
  script_path   = "~/bin/wlsunset.sh"
  on_click 3    = "exec ~/bin/wlsunset.sh toggle"
}

volume_status "mic" {
  format        = "MIC: {percentage}%"
  format_muted  = "MIC: MUTE"
  command       = "pactl"
  is_input      = true
  volume_delta  = 2
  color_muted   = "#FE8600"
  thresholds    = [(0, "normal")]
  button_mute   = 3
  on_click 2    = "exec pavucontrol-qt -t 4"
}

volume_status {
  format        = "VOL: {percentage}%"
  format_muted  = "VOL: M"
  command       = "pactl"
  volume_delta  = 2
  thresholds    = [(0, "good"), (45, "degraded"), (75, "bad")]
  button_mute   = 3
  on_click 2    = "exec pavucontrol-qt -t 3"
}

battery_level {
  format                = "BAT: {percent}%{icon}"
  blocks                = " "
  charging_character    = " CHR "
  separator             = false
  separator_block_width = 0
  threshold_bad         = 30
  threshold_degraded    = 70
  threshold_full        = 90
  color_charging        = "#FE8600"
  measurement_mode      = acpi
}

external_script "power" {
  script_path           = "~/bin/power_consumption.sh"
  format                = "{output}"
  cache_timeout         = 5
  separator             = false
  separator_block_width = 4
}

external_script tuned {
  script_path   = "~/bin/tuned.sh"
  format        = "{output}"
  cache_timeout = 10
  on_click 3    = "exec ~/bin/tuned.sh next"
  on_click 2    = "exec ~/bin/tuned.sh prev"
}

clock {
  format_time = "%a %d %b %H:%M:%S"
  separator   = true
}

sway_idle {
  format    = "\?if=inhibit_idle=False&color=degraded IDLE"
  separator = false
}

